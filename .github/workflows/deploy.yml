name: Deploy Find Jobs

on:
  workflow_dispatch:
  push:
    branches:
      [
        arena/be298902-findjobs,
        arena/29d1e244-findjobs,
        arena/98ac7a65-findjobs,
        arena/ff9585d3-findjobs,
        arena/c00da234-findjobs,
        arena/fb632330-findjobs,
        arena/6acbf55c-findjobs,
      ]
    paths:
      - .github/workflows/deploy.yml
      - scripts/deploy-cloudflare.mjs
      - scripts/cloudflare-integrations.mjs
      - scripts/check-live.mjs
      - scripts/check-openrouter.mjs
      - scripts/bootstrap-public-feed.mjs
      - src/**
      - functions/**
      - public/**
      - migrations/**
      - wrangler*.jsonc
      - package*.json
      - index.html
      - playwright.config.ts
      - tests/browser/**

permissions:
  contents: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    # No pull_request trigger: untrusted PR code must never receive deploy secrets.
    if: github.ref == 'refs/heads/arena/be298902-findjobs' || github.ref == 'refs/heads/arena/29d1e244-findjobs' || github.ref == 'refs/heads/arena/98ac7a65-findjobs' || github.ref == 'refs/heads/arena/ff9585d3-findjobs' || github.ref == 'refs/heads/arena/c00da234-findjobs' || github.ref == 'refs/heads/arena/fb632330-findjobs' || github.ref == 'refs/heads/arena/6acbf55c-findjobs'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_PAGES_PROJECT: fj-find-jobs
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
      FJ_CAPTURE_PUBLIC_SAMPLE: 'true'
    steps:
      - name: Check encrypted deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Save CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID at https://github.com/techoracle123/findjobs/settings/secrets/actions then rerun this job. No terminal needed.'
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo '::error::CLOUDFLARE_ACCOUNT_ID must be the 32-character Account ID from the Cloudflare dashboard.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run test:worker
      - run: npm run build
      - name: Verify OpenRouter independently with public job text
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/check-openrouter.mjs
      - name: Provision database and queue, migrate, and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          OTP_FROM: ${{ secrets.OTP_FROM }}
        run: node scripts/deploy-cloudflare.mjs
      - name: Install Chromium for live browser checks
        run: npx playwright install --with-deps chromium
      - name: Check live integrations and save a real-feed diagnostic snapshot
        run: node scripts/check-live.mjs
      - name: Test the live site at phone, tablet, and desktop widths
        run: npx playwright test
      - name: Save browser screenshots and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: find-jobs-browser-report
          path: |
            test-results/
            playwright-report/
            diagnostics/
          retention-days: 7
