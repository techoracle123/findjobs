name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test:unit

      - name: Worker integration tests
        run: npm run test:worker

      - name: Build
        run: npm run build

      - name: Refuse secrets in the browser bundle
        run: node scripts/scan-bundle-secrets.mjs dist

      - name: Install Chromium for isolated real-feed browser checks
        run: npx playwright install --with-deps chromium

      - name: Test the new interface against freshly ingested public jobs
        run: node scripts/verify-real-preview.mjs

      - name: Save isolated preview browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-preview-browser-report
          path: |
            test-results/
            playwright-report/
            diagnostics/
          retention-days: 7

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Verify generated data is in sync with its source
        run: |
          npm run db:seed:generate
          npm run data:generate
          git diff --exit-code migrations/0002_seed_demo_jobs.sql src/shared/country-data.ts
