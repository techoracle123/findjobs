name: Public feed HTTP diagnostics
on:
  push:
    branches: [arena/be298902-findjobs]
    paths: [.github/workflows/public-http-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - name: Compare bounded public HTTP clients and encodings
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { request } from '@playwright/test'
          const base='https://fj-find-jobs.pages.dev'
          const report=value=>console.log('::notice title=Public HTTP diagnostic::'+JSON.stringify(value))
          const contexts=await Promise.all([request.newContext(),request.newContext({extraHTTPHeaders:{'accept-encoding':'identity'}})])
          const paths=['/api/jobs?status=open&country=NG&limit=20','/api/jobs?status=open&limit=20&country=NG','/api/jobs?status=open&country=NG&limit=19']
          await Promise.all(contexts.flatMap((context,i)=>paths.map(async path=>{
            const start=Date.now()
            try{const response=await context.get(base+path,{timeout:15000});const body=await response.json();report({client:'playwright',identity:!!i,path,status:response.status(),total:body.total,ms:Date.now()-start})}
            catch(error){report({client:'playwright',identity:!!i,path,error:error.message.slice(0,500),ms:Date.now()-start})}
          })))
          await Promise.all(contexts.map(context=>context.dispose()))
          await Promise.all(paths.map(async path=>{
            const start=Date.now()
            try{const response=await fetch(base+path,{signal:AbortSignal.timeout(15000)});const body=await response.json();report({client:'node',path,status:response.status,total:body.total,ms:Date.now()-start})}
            catch(error){report({client:'node',path,error:error.message.slice(0,500),ms:Date.now()-start})}
          }))
          JS
