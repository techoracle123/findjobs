name: Live jobs and gigs HTTP diagnostics
on:
  push:
    branches: [arena/6acbf55c-findjobs]
    paths: [.github/workflows/public-http-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Check authenticated jobs and gigs endpoints repeatedly
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const base = 'https://fj-find-jobs.pages.dev'
          const notice = (title, value) =>
            console.log(`::notice title=${title}::${JSON.stringify(value).replaceAll('%', '%25').replaceAll('\n', '%0A')}`)
          const signup = await fetch(`${base}/api/auth/signup`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              name: 'Live Diagnostic',
              email: `live-diagnostic-${Date.now()}@example.com`,
              password: 'live diagnostic password',
            }),
            signal: AbortSignal.timeout(30_000),
          })
          if (!signup.ok) throw new Error(`Diagnostic sign-up returned ${signup.status}`)
          const cookie = (signup.headers.get('set-cookie') ?? '').split(';')[0]
          if (!cookie.startsWith('fj_session=')) throw new Error('Diagnostic sign-up set no session')

          const cases = []
          for (let repeat = 0; repeat < 5; repeat += 1) {
            cases.push(
              { lane: 'all', path: `/api/jobs?status=open&limit=20&offset=${repeat * 20}` },
              { lane: 'job', path: `/api/jobs?status=open&type=job&limit=20&offset=${repeat * 20}` },
              { lane: 'gig', path: `/api/jobs?status=open&type=gig&limit=20&offset=${repeat * 20}` },
            )
          }
          cases.push(
            { lane: 'gig-search-react', path: '/api/jobs?status=open&type=gig&limit=20&q=React' },
            { lane: 'gig-search-security', path: '/api/jobs?status=open&type=gig&limit=20&q=security' },
            { lane: 'gig-search-data', path: '/api/jobs?status=open&type=gig&limit=20&q=data' },
            { lane: 'nigeria', path: '/api/jobs?status=open&limit=20&country=NG' },
          )

          async function runCase(testCase) {
            const started = Date.now()
            try {
              const response = await fetch(`${base}${testCase.path}`, {
                headers: { accept: 'application/json', cookie },
                signal: AbortSignal.timeout(35_000),
              })
              const body = await response.json().catch(() => null)
              const jobs = Array.isArray(body?.jobs) ? body.jobs : []
              return {
                ...testCase,
                status: response.status,
                ok: response.ok,
                ms: Date.now() - started,
                total: typeof body?.total === 'number' ? body.total : null,
                returned: jobs.length,
                dataSource: typeof body?.dataSource === 'string' ? body.dataSource : null,
                facetGigTotal:
                  typeof body?.facets?.opportunities?.gig === 'number'
                    ? body.facets.opportunities.gig
                    : null,
                wrongGigRows: testCase.lane.startsWith('gig')
                  ? jobs.filter((job) => job.opportunityType !== 'gig').length
                  : 0,
                demoRows: jobs.filter((job) => job.isDemo).length,
              }
            } catch (error) {
              return {
                ...testCase,
                status: 0,
                ok: false,
                ms: Date.now() - started,
                error: error instanceof Error ? error.name : 'UnknownError',
              }
            }
          }

          const results = []
          for (let index = 0; index < cases.length; index += 4) {
            results.push(...(await Promise.all(cases.slice(index, index + 4).map(runCase))))
          }
          const byLane = {}
          for (const result of results) {
            const lane = (byLane[result.lane] ??= {
              attempts: 0,
              successes: 0,
              statuses: {},
              maxMs: 0,
              totals: [],
              wrongGigRows: 0,
              demoRows: 0,
            })
            lane.attempts += 1
            if (result.ok) lane.successes += 1
            lane.statuses[result.status] = (lane.statuses[result.status] ?? 0) + 1
            lane.maxMs = Math.max(lane.maxMs, result.ms)
            if (typeof result.total === 'number') lane.totals.push(result.total)
            lane.wrongGigRows += result.wrongGigRows ?? 0
            lane.demoRows += result.demoRows ?? 0
          }
          const failures = results.filter(
            (result) =>
              !result.ok ||
              result.total === null ||
              (result.lane === 'gig' && result.total <= 0) ||
              result.wrongGigRows > 0 ||
              result.demoRows > 0,
          )
          notice('Live jobs and gigs diagnostic summary', byLane)
          if (failures.length) {
            notice('Live jobs and gigs diagnostic failures', failures.slice(0, 10))
            throw new Error(`${failures.length} live jobs/gigs checks failed`)
          }
          JS
